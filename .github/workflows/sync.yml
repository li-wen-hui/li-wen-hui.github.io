name: Sync Academic Data


on:

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Sync sources
        run: |
          python scripts/sync_sources.py


      - name: Build website
        run: |
          python scripts/build_site.py


      - name: Commit updates
        run: |

          git config user.name "github-actions"

          git config user.email "actions@github.com"

          git add .

          git commit -m "Automatic academic data update" || exit 0

          git push
