bio: >-
  I am a Master's student in Control Science and Engineering at Henan University,
  advised by Prof. Xiuli Chai. My research focuses on image representation and
  multimedia security. I am particularly interested in orthogonal moments,
  transform-domain representations, and robust reversible watermarking, with an
  emphasis on principled representations that remain stable under real-world
  signal processing and geometric distortions.

short_bio: >-
  My research focuses on image representation, orthogonal moments, and multimedia security.

